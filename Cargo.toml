[package]
name = "octane-bootstrapper"
version = "12.0.0"
edition = "2021"
description = "Official Octane client bootstrapper"

[[bin]]
name = "OctanePlayerLauncher"
path = "src/main.rs"

[dependencies]
eframe                = { version = "0.27", default-features = false, features = ["glow", "default_fonts"] }
image                 = { version = "0.25", default-features = false, features = ["png"] }
anyhow                = "1"
percent-encoding      = "2"
reqwest               = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip                   = { version = "2", default-features = false, features = ["deflate"] }
directories           = "5"
discord-rich-presence = "0.2"
winreg                = "0.52"
windows-sys           = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug"] }
windows               = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ico   = "0.3"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
