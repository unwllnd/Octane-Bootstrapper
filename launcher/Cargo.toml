[package]
name = "octane-bootstrapper"
version = "1.3.0"
edition = "2021"
description = "Official Octane client bootstrapper"

[[bin]]
name = "OctanePlayerLauncher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
discord-rich-presence = "0.2"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde_json = "1"
webpki-roots = "1"
winreg = "0.56"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
ico = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
trim-paths = "all"
